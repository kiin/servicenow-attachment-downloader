name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]          # push a tag like v1.0.0 to publish a Release
  workflow_dispatch:      # "Run workflow" button in the Actions tab

permissions:
  contents: write         # needed to create Releases on tags

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --console --clean --name sn-attachment-downloader download_attachments.py

      - name: Add example config
        run: Copy-Item .env.example dist\.env.example

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sn-attachment-downloader
          path: |
            dist/sn-attachment-downloader.exe
            dist/.env.example
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sn-attachment-downloader.exe
            dist/.env.example
          generate_release_notes: true
